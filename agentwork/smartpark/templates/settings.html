{% extends "base.html" %}{% block content %}<section class="panel"><h3>Parking settings</h3><form id="settings-form"><label>Parking capacity <input name="parking_capacity" type="number" min="1"></label><label>Initial fee <input name="initial_fee" type="number" min="0" step="0.01"></label><label>Additional hourly fee <input name="hourly_fee" type="number" min="0" step="0.01"></label><label>Grace period (minutes) <input name="grace_period_minutes" type="number" min="0"></label><label>Currency <input name="currency" maxlength="5"></label><label>Recognition confidence threshold <input name="recognition_confidence_threshold" type="number" min="0" max="1" step="0.01"></label><label>Detection interval (seconds) <input name="detection_interval_seconds" type="number" min="0.2" step="0.1"></label><label>Duplicate cooldown (seconds) <input name="duplicate_cooldown_seconds" type="number" min="0.2" step="0.1"></label><button>Save settings</button></form><p id="settings-message"></p></section><section class="panel"><h3>Camera discovery</h3><p>Use the Live Camera page to refresh, connect and switch named Windows cameras, including Iriun when its driver is streaming.</p><div id="camera-list">Loading cameras...</div></section>{% endblock %}
